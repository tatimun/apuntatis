name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.128.0
      GITALK_CLIENT_SECRET: ${{ secrets.GITALK_CLIENT_SECRET }}
      GITALK_CLIENT_ID: ${{ secrets.GITALK_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "latest"
          extended: true

      # ⭐ Volvés a bajar el theme:
      - name: Download GitHub-Style theme
        run: |
          mkdir -p themes
          git clone https://github.com/MeiK2333/github-style.git themes/github-style

      # ⭐ Reemplazar variables del Gitalk
      - name: Replace secrets in hugo.toml
        run: |
          envsubst < hugo.toml > hugo.generated.toml
          mv hugo.generated.toml hugo.toml
        env:
          GITALK_CLIENT_ID: ${{ secrets.GITALK_ID }}
          GITALK_CLIENT_SECRET: ${{ secrets.GITALK_CLIENT_SECRET }}

      - name: Build site
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

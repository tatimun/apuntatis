name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "latest"
          extended: true

      # ⭐ REEMPLAZAR VARIABLES EN hugo.toml ⭐
      - name: Replace Gitalk secrets in hugo.toml
        run: |
          echo "== Antes de reemplazar =="
          cat hugo.toml

          envsubst < hugo.toml > hugo.tmp
          mv hugo.tmp hugo.toml

          echo "== Después de reemplazar =="
          cat hugo.toml
        env:
          GITALK_CLIENT_ID: ${{ secrets.GITALK_ID }}
          GITALK_CLIENT_SECRET: ${{ secrets.GITALK_CLIENT_SECRET }}

      - name: Build site
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

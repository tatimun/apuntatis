baseURL = "https://tatimun.github.io/apuntatis"
languageCode = "es"
title = "Apuntatis"
theme = "github-style"

pygmentsCodeFences = true
pygmentsUseClasses = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML"]
  term = ["HTML"]
  taxonomy = ["HTML"]

[pagination]
  pagerSize = 10

[params]
  author = "Tati"
  description = "Rompiendo cosas 😋"
  email = "apuntatis@gmail.com"
  keywords = "blog, google analytics"
  custom_css = ["css/custom.css"]
  custom_js = ["js/custom.js"]
  
  # ⭐ RUTAS CORRECTAS PARA GITHUB PAGES
  avatar = "images/avatar.gif"
  favicon = "images/github-mark.png"
  headerIcon = "images/github-mark-white.png"
  github = "tatimun"
  twitter = ""
  facebook = ""
  linkedin = ""
  instagram = ""
  tumblr = ""

  location = "Argentina"
  url = "https://tatimun.github.io/apuntatis"
  rss = true
  lastmod = true
  userStatusEmoji = "😀"
  enableSearch = true
  enableGitalk = true

  [[params.links]]
    title = "Apuntatis"
    href = "https://tatimun.github.io/apuntatis"
    icon = "images/avatar.gif"

  [[params.links]]
    title = "Postman"
    href = "https://www.postman.com/titamoon"
    icon = "images/postman-icon.svg"

[frontmatter]
  lastmod = ["lastmod", ":fileModTime", ":default"]

  [params.gitalk]
    clientID = "$GITALK_CLIENT_ID"
    clientSecret = "$GITALK_CLIENT_SECRET"
    repo = "apuntatis"
    owner = "tatimun"
    admin = "tatimun"
    id = "location.pathname"
    labels = ["gitalk"]
    perPage = 15
    pagerDirection = "last"
    createIssueManually = true
    distractionFreeMode = false
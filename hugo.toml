  description = "Rompiendo cosas 😋"
  email = "apuntatis@gmail.com"

  custom_css = ["css/custom.css"]
  custom_js = ["js/custom.js"]
  
  # ⭐ RUTAS CORRECTAS PARA GITHUB PAGES
  avatar = "images/avatar.gif"
  favicon = "images/github-mark.png"
  headerIcon = "images/github-mark-white.png"

  twitter = ""
  facebook = ""
  linkedin = ""
  instagram = ""
  tumblr = ""

  location = "Argentina"
  url = "https://tatimun.github.io/apuntatis"
  rss = true
  lastmod = true

  enableSearch = true
  enableGitalk = false

  [[params.links]]
    title = "Mi GitHub"
    href = "https://github.com/tatimun"
    icon = "images/github-mark.png"

  [[params.links]]
    title = "Apuntatis"
    href = "https://tatimun.github.io/apuntatis/"
